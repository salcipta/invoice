<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1e40af">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Invoice Salcipta Marketing</title>
<style>

/* =========================================================
   RESET & BASE
   ========================================================= */
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  background: #f1f5f9; color: #1e293b;
  max-width: 640px; margin: 0 auto; min-height: 100vh;
  padding-bottom: env(safe-area-inset-bottom);
  font-size: 15px;
}

/* =========================================================
   HEADER
   ========================================================= */
header {
  background: #1e40af; color: white; padding: .85rem 1rem;
  display: flex; justify-content: space-between; align-items: center;
  position: sticky; top: 0; z-index: 10;
  padding-top: calc(.85rem + env(safe-area-inset-top));
}
header h1 { font-size: 1.05rem; font-weight: 600; }
.header-aksi { display: flex; gap: .3rem; align-items: center; }
.header-aksi button {
  background: rgba(255,255,255,.18); border: none; color: white;
  padding: .45rem .55rem; border-radius: 8px; font-size: 1rem;
  cursor: pointer; line-height: 1;
}
.header-aksi button:active { background: rgba(255,255,255,.35); }
.status { font-size: .7rem; opacity: .9; min-width: 60px; text-align: right; }

/* =========================================================
   SEARCH & FILTER
   ========================================================= */
.search-bar {
  display: flex; gap: .5rem; padding: .7rem;
  position: sticky; top: 56px; background: #f1f5f9; z-index: 5;
}
.search-bar input {
  flex: 1; padding: .7rem .9rem; border: 1px solid #e2e8f0;
  border-radius: 10px; font-size: 1rem; background: white;
}
.search-bar input:focus { outline: none; border-color: #1e40af; }
.search-bar button {
  background: #1e40af; color: white; border: none;
  width: 48px; border-radius: 10px; font-size: 1.5rem;
  cursor: pointer; line-height: 1;
}

.filter { display: flex; gap: .4rem; padding: 0 .7rem .6rem; overflow-x: auto; }
.filter button {
  flex: 1; min-width: 70px; padding: .5rem .3rem;
  border: 1px solid #e2e8f0; background: white;
  border-radius: 8px; cursor: pointer;
  font-size: .8rem; color: #475569; white-space: nowrap;
}
.filter button.aktif { background: #1e40af; color: white; border-color: #1e40af; }

/* =========================================================
   SENARAI DOKUMEN
   ========================================================= */
main { padding: 0 .5rem 2rem; }
.kad {
  background: white; border-radius: 12px; padding: .85rem 1rem;
  margin-bottom: .5rem; box-shadow: 0 1px 3px rgba(0,0,0,.06);
  cursor: pointer; transition: transform .1s;
  display: flex; justify-content: space-between; gap: .75rem;
  align-items: center;
}
.kad:active { transform: scale(.98); }
.kad-info { flex: 1; min-width: 0; }
.kad-no {
  font-size: .78rem; color: #1e40af; font-weight: 600;
  margin-bottom: .15rem; letter-spacing: .3px;
}
.kad-nama {
  font-size: .95rem; font-weight: 500;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  margin-bottom: .15rem;
}
.kad-meta {
  font-size: .75rem; color: #64748b;
  display: flex; gap: .6rem; flex-wrap: wrap;
}
.kad-aksi { display: flex; flex-direction: column; gap: .3rem; }
.kad-aksi button {
  background: transparent; border: none; font-size: 1rem;
  cursor: pointer; padding: .35rem; border-radius: 6px;
  opacity: .6;
}
.kad-aksi button:active { opacity: 1; background: #f1f5f9; }
.badge-jenis {
  display: inline-block; font-size: .65rem; padding: .15rem .45rem;
  border-radius: 20px; font-weight: 600; letter-spacing: .3px;
}
.badge-jenis.invoice   { background: #dbeafe; color: #1e40af; }
.badge-jenis.quotation { background: #fef3c7; color: #92400e; }
.badge-jenis.receipt   { background: #dcfce7; color: #166534; }
.badge-jenis.delivery  { background: #e9d5ff; color: #6b21a8; }

.kosong { text-align: center; padding: 3rem 1rem; color: #64748b; }
.kosong p:first-child { font-size: 2rem; margin-bottom: .5rem; }
.kosong .kecil { font-size: .85rem; margin-top: .25rem; }

/* =========================================================
   MODAL
   ========================================================= */
#modal {
  position: fixed; inset: 0; background: rgba(0,0,0,.5);
  display: flex; align-items: flex-end; z-index: 100;
}
#modal.hidden { display: none; }
.modal-kandungan {
  background: white; width: 100%; max-height: 96vh;
  border-radius: 16px 16px 0 0; overflow-y: auto;
  animation: slideUp .2s ease; max-width: 900px; margin: 0 auto;
}
@keyframes slideUp { from { transform: translateY(40px); opacity: 0; } }
.modal-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 1rem; border-bottom: 1px solid #e2e8f0;
  position: sticky; top: 0; background: white; z-index: 1;
}
.modal-header h2 { font-size: 1.05rem; font-weight: 600; }
.modal-header button {
  background: transparent; border: none; font-size: 1.3rem;
  cursor: pointer; color: #64748b; padding: .2rem .4rem;
}

/* =========================================================
   BORANG
   ========================================================= */
.borang { padding: 1rem; display: flex; flex-direction: column; gap: .8rem; }
.borang label {
  display: flex; flex-direction: column; gap: .3rem;
  font-size: .82rem; color: #475569; font-weight: 500;
}
.borang input, .borang select, .borang textarea {
  padding: .7rem .8rem; border: 1px solid #e2e8f0;
  border-radius: 8px; font-size: 1rem; font-family: inherit;
  background: white; color: #1e293b; width: 100%;
}
.borang input:focus, .borang select:focus, .borang textarea:focus {
  outline: none; border-color: #1e40af;
}
.borang textarea { resize: vertical; min-height: 60px; }
.baris-2 { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; }
.baris-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: .5rem; }
.preview-hint { font-size: .72rem; color: #94a3b8; font-weight: 400; }

/* Item table */
.item-jadual {
  width: 100%; border-collapse: collapse; font-size: .85rem;
  margin-top: .4rem;
}
.item-jadual th {
  background: #f1f5f9; padding: .5rem .4rem; text-align: left;
  font-size: .7rem; color: #475569; font-weight: 600;
  border-bottom: 1px solid #e2e8f0;
}
.item-jadual td { padding: .3rem .2rem; vertical-align: middle; }
.item-jadual input {
  padding: .45rem .4rem; border: 1px solid #e2e8f0;
  border-radius: 6px; font-size: .85rem; width: 100%;
}
.item-jadual .kanan { text-align: right; }
.item-jadual .tengah { text-align: center; }
.item-jadual .btn-padam-item {
  background: #fee2e2; color: #991b1b; border: none;
  width: 28px; height: 28px; border-radius: 6px;
  cursor: pointer; font-size: .9rem;
}
.item-jadual .jumlah-sel { font-weight: 600; color: #1e40af; }
.btn-tambah-item {
  margin-top: .5rem; padding: .55rem 1rem;
  background: white; color: #1e40af; border: 1.5px solid #1e40af;
  border-radius: 8px; font-size: .85rem; font-weight: 500;
  cursor: pointer;
}

/* Jumlah */
.jumlah-kotak {
  background: #f8fafc; border: 1px solid #e2e8f0;
  border-radius: 10px; padding: .8rem 1rem;
  display: flex; flex-direction: column; gap: .4rem;
  margin-top: .5rem;
}
.jumlah-baris {
  display: flex; justify-content: space-between; font-size: .9rem;
}
.jumlah-baris.total {
  border-top: 1px solid #e2e8f0; padding-top: .5rem;
  font-size: 1.05rem; font-weight: 700; color: #1e40af;
}

/* Aksi */
.aksi { display: flex; gap: .5rem; margin-top: 1rem; }
.aksi button {
  flex: 1; padding: .8rem; border-radius: 10px; font-size: .95rem;
  cursor: pointer; border: none; font-weight: 600;
}
.utama { background: #1e40af; color: white; }
.utama:active { background: #1e3a8a; }
.sekunder { background: #e2e8f0; color: #1e293b; }
.bahaya { background: #fee2e2; color: #991b1b; }
.hijau { background: #16a34a; color: white; }

/* =========================================================
   TOAST
   ========================================================= */
.toast {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  background: #1e293b; color: white; padding: .7rem 1.2rem;
  border-radius: 20px; font-size: .85rem; z-index: 200;
  opacity: 0; transition: opacity .3s; pointer-events: none;
  max-width: 90%; text-align: center;
}
.toast.show { opacity: 1; }

/* =========================================================
   PIN GATE
   ========================================================= */
#pinGate {
  position: fixed; inset: 0; background: #1e40af;
  display: flex; align-items: center; justify-content: center;
  z-index: 9999; flex-direction: column; padding: 1rem;
}
.pin-kotak {
  background: white; border-radius: 16px; padding: 1.5rem;
  max-width: 320px; width: 100%; text-align: center;
}
.pin-kotak h1 { font-size: 1.6rem; margin-bottom: .25rem; }
.pin-kotak h2 { font-size: 1.05rem; margin-bottom: 1rem; color: #1e293b; }
#pinMsg { font-size: .85rem; color: #64748b; margin-bottom: 1rem; }
#pinDots {
  display: flex; gap: .75rem; justify-content: center;
  margin-bottom: 1.25rem;
}
#pinDots .dot {
  width: 14px; height: 14px; border-radius: 50%;
  background: #e2e8f0; transition: background .15s;
}
#pinDots .dot.aktif { background: #1e40af; }
#pinDots .dot.salah { background: #ef4444; }
#pinPad {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem;
}
.pin-btn {
  padding: 1rem; font-size: 1.3rem; font-weight: 600;
  background: #f1f5f9; border: none; border-radius: 12px;
  cursor: pointer; color: #1e293b;
}
.pin-btn:active { background: #e2e8f0; }
.pin-btn.kosong { background: transparent; cursor: default; }

/* =========================================================
   PRINT — A4 (Invoice, Quotation, DO)
   ========================================================= */
#printArea { display: none; }

@media print {
  @page { size: A4; margin: 12mm; }

  body > *:not(#printArea) { display: none !important; }
  #printArea { display: block !important; }

  html, body {
    background: white !important;
    max-width: 100% !important;
    margin: 0 !important;
    padding: 0 !important;
    font-size: 11pt;
    color: #000;
  }

  /* Receipt A5 — bila body ada class .print-a5 */
  body.print-a5 { }
  body.print-a5 ~ #printArea { }
}



/* =========================================================
   DOKUMEN PRINT (dalam #printArea)
   ========================================================= */
.doc-print {
  color: #000;
  font-family: Arial, sans-serif;
  font-size: 11pt;
  line-height: 1.4;
}
.doc-print .doc-header {
  display: flex; justify-content: space-between;
  align-items: flex-start; gap: 1rem;
  border-bottom: 2px solid #000; padding-bottom: .6rem;
  margin-bottom: 1rem;
}
.doc-print .syarikat-nama {
  font-size: 1.4rem; font-weight: 700; color: #1e40af;
  margin-bottom: .2rem;
}
.doc-print .syarikat-info {
  font-size: .8rem; color: #333; white-space: pre-line;
}
.doc-print .doc-tajuk {
  text-align: right;
}
.doc-print .doc-jenis {
  font-size: 1.6rem; font-weight: 700; color: #1e40af;
  letter-spacing: 1px; margin-bottom: .3rem;
}
.doc-print .doc-meta {
  font-size: .8rem;
}
.doc-print .doc-meta b { color: #1e40af; }

.doc-print .doc-pihak {
  display: grid; grid-template-columns: 1.2fr 1fr;
  gap: 1.5rem; margin-bottom: 1rem;
}
.doc-print .doc-pihak .label {
  font-size: .7rem; color: #666; text-transform: uppercase;
  letter-spacing: .5px; margin-bottom: .25rem; font-weight: 600;
}
.doc-print .pelanggan-nama { font-weight: 700; font-size: 1rem; }
.doc-print .pelanggan-info {
  font-size: .85rem; color: #333; white-space: pre-line;
}

.doc-print table {
  width: 100%; border-collapse: collapse;
  margin-top: .5rem; margin-bottom: 1rem;
}
.doc-print table thead th {
  background: #e2e8f0; padding: .55rem .5rem;
  text-align: left; font-size: .82rem; font-weight: 700;
  border: 1px solid #999;
}
.doc-print table tbody td {
  padding: .5rem .5rem; border: 1px solid #ccc;
  font-size: .88rem; vertical-align: top;
}
.doc-print table .kanan { text-align: right; }
.doc-print table .tengah { text-align: center; }
.doc-print table tfoot td {
  padding: .5rem; border: 1px solid #ccc; font-weight: 700;
}

.doc-print .jumlah-kotak-print {
  margin-left: auto; width: 260px;
  border: 1px solid #ccc; border-radius: 6px;
  padding: .5rem .8rem; margin-top: .5rem;
}
.doc-print .jumlah-baris-print {
  display: flex; justify-content: space-between;
  padding: .25rem 0; font-size: .9rem;
}
.doc-print .jumlah-baris-print.total {
  padding-top: .4rem;
  font-size: 1.1rem; font-weight: 700; color: #1e40af;
  margin-top: .3rem;
}

.doc-print .nota-kotak {
  margin-top: 1rem; padding: .6rem .8rem;
  background: #f8fafc; border-left: 3px solid #1e40af;
  font-size: .85rem;
}
.doc-print .nota-label {
  font-size: .7rem; color: #666; text-transform: uppercase;
  letter-spacing: .5px; font-weight: 600; margin-bottom: .2rem;
}

.doc-print .pembayaran {
  margin-top: 1rem; padding: .6rem .8rem;
  background: #f8fafc; border: 1px solid #e2e8f0;
  border-radius: 6px; font-size: .82rem;
}
.doc-print .pembayaran b { color: #1e40af; }

.doc-print .tandatangan-kotak {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 2rem; margin-top: 2.5rem; page-break-inside: avoid;
}
.doc-print .tandatangan-satu {
  text-align: center;
}
.doc-print .tandatangan-garis {
  border-bottom: 1px solid #000;
  height: 60px; margin-bottom: .3rem;
}
.doc-print .tandatangan-label {
  font-size: .8rem; color: #333;
}
.doc-print .tandatangan-nama {
  font-weight: 600; font-size: .85rem;
  margin-top: .2rem; min-height: 1.1em;
}

/* Receipt A5 — layout lebih padat */
.doc-print.receipt-a5 {
  max-width: 100%;
  font-size: 10pt;
}
.doc-print.receipt-a5 .doc-header {
  border-bottom: 1.5px solid #000;
}
.doc-print.receipt-a5 .doc-jenis { font-size: 1.3rem; }
.doc-print.receipt-a5 .syarikat-nama { font-size: 1.1rem; }
.doc-print.receipt-a5 table { margin-bottom: .6rem; }
.doc-print.receipt-a5 table thead th,
.doc-print.receipt-a5 table tbody td {
  padding: .35rem .4rem; font-size: .8rem;
}
.doc-print.receipt-a5 .jumlah-kotak-print {
  width: 220px; padding: .4rem .6rem;
}
.doc-print.receipt-a5 .nota-kotak,
.doc-print.receipt-a5 .pembayaran {
  padding: .4rem .6rem; font-size: .78rem;
}

/* =========================================================
   PRINT STYLE v2 — B&W, Padat, Minimal Garis
   (override semua CSS cetakan di atas)
   ========================================================= */
@media print {
  @page { size: A4; margin: 10mm; }
  body.print-a5 { }
}

/* Khusus receipt — A5 margin lebih kecil */
@media print {
  #printA5Style { }
}

}

}

}

/* ---------- RECEIPT A5 — lebih padat ---------- */
.doc-print.receipt-a5 {
  font-size: 9pt !important;
}
.doc-print.receipt-a5 .doc-header {
  border-bottom: 1px solid #000 !important;
  padding-bottom: .3rem !important;
  margin-bottom: .4rem !important;
}
.doc-print.receipt-a5 .syarikat-nama { font-size: 1rem !important; }
.doc-print.receipt-a5 .syarikat-info { font-size: .7rem !important; }
.doc-print.receipt-a5 .doc-jenis { font-size: 1.1rem !important; }

.doc-print.receipt-a5 table { margin: .2rem 0 .4rem !important; }

  padding: .25rem .3rem !important;

.doc-print.receipt-a5 table tbody td {
  padding: .22rem .3rem !important;
  font-size: .75rem !important;
}
.doc-print.receipt-a5 .jumlah-kotak-print {
  width: 200px !important;
  padding: .25rem .4rem !important;
}
.doc-print.receipt-a5 .jumlah-baris-print {
  font-size: .78rem !important;
}
.doc-print.receipt-a5 .jumlah-baris-print.total {
  font-size: .92rem !important;
}
.doc-print.receipt-a5 .nota-kotak,
.doc-print.receipt-a5 .pembayaran {
  padding: .25rem .4rem !important;
  font-size: .72rem !important;
  margin-top: .4rem !important;
}

/* =========================================================
   WATERMARK PAID — untuk receipt sahaja
   ========================================================= */
.doc-print.receipt-a5 {
  position: relative;
}

.doc-print.receipt-a5::before {
  content: 'PAID';
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) rotate(-30deg);
  font-size: 6rem;
  font-weight: 900;
  color: #f0f0f0;

/* =========================================================

.amaran-rujukan .btn-update:active { background: #d97706; }

/* Butang update dari rujukan — dalam borang */
.btn-refresh-rujukan {

  padding: .5rem .8rem;
  background: white;
  color: #1e40af;
  border: 1.5px solid #1e40af;

</style>
</head>
<body>

<!-- =========================================================
     PIN GATE
     ========================================================= -->
<div id="pinGate">
  <div class="pin-kotak">
    <h1>🔒</h1>
    <h2>Invoice Salcipta Marketing</h2>
    <p id="pinMsg">Masukkan 4-digit PIN</p>
    <div id="pinDots">
      <span class="dot"></span><span class="dot"></span>
      <span class="dot"></span><span class="dot"></span>
    </div>
    <div id="pinPad">
      <button class="pin-btn" data-pin="1">1</button>
      <button class="pin-btn" data-pin="2">2</button>
      <button class="pin-btn" data-pin="3">3</button>
      <button class="pin-btn" data-pin="4">4</button>
      <button class="pin-btn" data-pin="5">5</button>
      <button class="pin-btn" data-pin="6">6</button>
      <button class="pin-btn" data-pin="7">7</button>
      <button class="pin-btn" data-pin="8">8</button>
      <button class="pin-btn" data-pin="9">9</button>
      <button class="pin-btn kosong"></button>
      <button class="pin-btn" data-pin="0">0</button>
      <button class="pin-btn" id="pinDelete">⌫</button>
    </div>
    <p style="font-size:.75rem;color:#94a3b8;margin-top:1rem">
      <a href="#" id="pinForgot" style="color:#94a3b8;text-decoration:underline">Lupa PIN?</a>
    </p>
  </div>
</div>

<!-- =========================================================
     APP (tersembunyi sebelum login)
     ========================================================= -->
<div id="appUtama" style="display:none">

<header>
  <h1>📄 Invoice Salcipta Marketing</h1>
  <div class="header-aksi">
    <span class="status" id="status">—</span>
    <button id="btnSync" title="Muat dari Drive">🔄</button>
    <button id="btnTetapan" title="Tetapan">⚙️</button>
  </div>
</header>

<div class="search-bar">
  <input type="search" id="carian" placeholder="🔍 Cari no / nama pelanggan...">
  <button id="btnTambah">+</button>
</div>

<div class="filter">
  <button data-filter="semua" class="aktif">Semua</button>
  <button data-filter="invoice">Invois</button>
  <button data-filter="quotation">Sebut Harga</button>
  <button data-filter="receipt">Resit</button>
  <button data-filter="delivery">DO</button>
</div>

<main id="senarai"></main>

</div><!-- /appUtama -->

<!-- =========================================================
     MODAL & TOAST
     ========================================================= -->
<div id="modal" class="hidden"></div>
<div id="toast" class="toast"></div>

<!-- =========================================================
     PRINT AREA (tersembunyi)
     ========================================================= -->
<div id="printArea"></div>

<!-- =========================================================
     JAVASCRIPT — akan diisi dalam BAHAGIAN 3
     ========================================================= -->

<script>
/* =========================================================
   INVOICE APP — app.js (v1)
   ========================================================= */

/* ---------- KONFIGURASI ---------- */
const GAS_URL_KEY = 'inv_gas_url';
const PIN_HASH_KEY = 'inv_pin_hash';
const DEFAULT_GAS_URL = 'https://script.google.com/macros/s/AKfycbwwZSJtxQNcAT2Ex87HjG3f9DWCze9ZApRvODuVQx_U4IjaHQZFInbFmWPPQMTb_jDB/exec';

const PIN_DEFAULT_HASH = '03ac674216f3e15c761ee1a5e255f067953623c8b388b4459e13f978d7c846f4'; // "1234"

let GAS_URL   = localStorage.getItem(GAS_URL_KEY) || DEFAULT_GAS_URL;
let PIN_HASH  = localStorage.getItem(PIN_HASH_KEY) || PIN_DEFAULT_HASH;

/* ---------- STATE ---------- */
let dokumen    = [];
let counter    = {};
let syarikat   = {};
let pelanggan  = [];

let filterJenis = 'semua';
let kataCarian = '';
let editId = null;
let jenisSemasa = 'invoice';   // dropdown terakhir
let senaraiItemSemasa = [];

/* ---------- HELPER ---------- */
const $  = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

const uuid = () => crypto.randomUUID ? crypto.randomUUID()
  : Date.now() + '-' + Math.random().toString(36).slice(2);

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function formatRM(n) {
  if (n === null || n === undefined || n === '') return '0.00';
  return Number(n).toLocaleString('ms-MY', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function formatTarikh(iso) {
  if (!iso) return '-';
  const d = new Date(iso);
  const dd = String(d.getDate()).padStart(2, '0');
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const yyyy = d.getFullYear();
  return `${dd}/${mm}/${yyyy}`;
}

function tarikhHariIni() {
  const d = new Date();
  const dd = String(d.getDate()).padStart(2, '0');
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const yyyy = d.getFullYear();
  return `${yyyy}-${mm}-${dd}`;
}

function tambahHari(tarikhIso, hari) {
  const d = new Date(tarikhIso);
  d.setDate(d.getDate() + hari);
  const dd = String(d.getDate()).padStart(2, '0');
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const yyyy = d.getFullYear();
  return `${yyyy}-${mm}-${dd}`;
}

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._tid);
  t._tid = setTimeout(() => t.classList.remove('show'), 2200);
}

function setStatus(msg) { $('#status').textContent = msg; }

/* =========================================================
   PIN GATE
   ========================================================= */
let pinInput = '';
let pinCubaan = 0;

async function hashPin(pin) {
  const enc = new TextEncoder().encode(pin);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf))
    .map(b => b.toString(16).padStart(2, '0')).join('');
}

function kemaskiniDots() {
  document.querySelectorAll('#pinDots .dot').forEach((d, i) => {
    d.classList.toggle('aktif', i < pinInput.length);
  });
}

function pinSalah() {
  const dots = document.querySelectorAll('#pinDots .dot');
  dots.forEach(d => d.classList.add('salah'));
  $('#pinMsg').textContent = '❌ PIN salah';
  $('#pinMsg').style.color = '#ef4444';
  setTimeout(() => {
    dots.forEach(d => d.classList.remove('salah', 'aktif'));
    pinInput = '';
    $('#pinMsg').textContent = 'Masukkan 4-digit PIN';
    $('#pinMsg').style.color = '#64748b';
  }, 700);
}

async function pinSemak() {
  const hash = await hashPin(pinInput);
  if (hash === PIN_HASH) {
    sessionStorage.setItem('inv_pin_ok', '1');
    bukaApp();
  } else {
    pinCubaan++;
    if (pinCubaan >= 5) {
      $('#pinMsg').textContent = '⛔ Terlalu banyak cubaan.';
      setTimeout(() => location.reload(), 3000);
      return;
    }
    pinSalah();
  }
}

function pinTambah(n) {
  if (pinInput.length >= 4) return;
  pinInput += n;
  kemaskiniDots();
  if (pinInput.length === 4) setTimeout(pinSemak, 150);
}

function pinPadam() {
  pinInput = pinInput.slice(0, -1);
  kemaskiniDots();
}

document.addEventListener('click', (e) => {
  const btn = e.target.closest('.pin-btn');
  if (!btn) return;
  const pin = btn.dataset.pin;
  if (pin !== undefined) pinTambah(pin);
});
document.addEventListener('click', (e) => {
  if (e.target.closest('#pinDelete')) pinPadam();
});

document.addEventListener('click', (e) => {
  if (e.target.closest('#pinForgot')) {
    e.preventDefault();
    if (confirm('Lupa PIN? Data tidak akan hilang. Hanya PIN direset ke 1234. Teruskan?')) {
      localStorage.removeItem(PIN_HASH_KEY);
      location.reload();
    }
  }
});

/* =========================================================
   BUKA APP
   ========================================================= */
function bukaApp() {
  $('#pinGate').style.display = 'none';
  $('#appUtama').style.display = 'block';
  muatSemua();
  pasangEvent();
  loadCustomers();   // ⬅️ TAMBAH BARIS INI
}
/* =========================================================
   API CALL
   ========================================================= */
async function apiGet(action, params = {}) {
  const q = new URLSearchParams({ action, ...params });
  const res = await fetch(GAS_URL + '?' + q.toString());
  const text = await res.text();
  try { return JSON.parse(text); }
  catch { throw new Error('Response bukan JSON: ' + text.slice(0, 150)); }
}

async function apiPost(body) {
  const res = await fetch(GAS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body),
    redirect: 'follow'
  });
  const text = await res.text();
  try { return JSON.parse(text); }
  catch { throw new Error('Response bukan JSON: ' + text.slice(0, 150)); }
}

/* ---------- MUAT SEMUA DATA ---------- */
async function muatSemua(senyap = false) {
  if (!senyap) { setStatus('⏳'); toast('Muat dari Drive...'); }
  try {
    const j = await apiGet('loadSemua');
    if (!j.ok) throw new Error(j.error || 'Gagal');
    dokumen   = j.data.dokumen   || [];
    counter   = j.data.counter   || {};
    syarikat  = j.data.syarikat  || {};
    pelanggan = j.data.pelanggan || [];
    setStatus('✓ ' + new Date().toLocaleTimeString('ms-MY', { hour: '2-digit', minute: '2-digit' }));
    renderSenarai();
    if (!senyap) toast(`✅ ${dokumen.length} dokumen dimuat`);
  } catch (e) {
    console.warn(e);
    setStatus('⚠️');
    if (!senyap) toast('Gagal muat: ' + e.message);
  }
}

/* =========================================================
   RENDER SENARAI
   ========================================================= */
function dokumenDitapis() {
  const q = kataCarian.toLowerCase().trim();
  return dokumen.filter(d => {
    if (filterJenis !== 'semua' && d.jenis !== filterJenis) return false;
    if (!q) return true;
    return (d.no || '').toLowerCase().includes(q)
        || (d.pelanggan?.nama || '').toLowerCase().includes(q);
  });
}

function renderSenarai() {
  let data = dokumenDitapis();

  // Susun ikut tarikh dicipta (baru di atas)
  data = [...data].sort((a, b) =>
    new Date(b.dicipta || 0) - new Date(a.dicipta || 0)
  );

  // Kalau tiada carian & filter "semua" → tunjuk 5 terakhir sahaja
  const adaCarian = kataCarian.trim().length > 0;
  const adaFilter = filterJenis !== 'semua';
  if (!adaCarian && !adaFilter) data = data.slice(0, 5);

  if (!data.length) {
    $('#senarai').innerHTML = `
      <div class="kosong">
        <p>📄</p>
        <p>${adaCarian ? 'Tiada hasil carian' : 'Belum ada dokumen'}</p>
        <p class="kecil">Tekan + untuk cipta baru</p>
      </div>`;
    return;
  }

  const labelJenis = {
    invoice: 'INVOIS',
    quotation: 'SEBUT HARGA',
    receipt: 'RESIT',
    delivery: 'DO'
  };

  $('#senarai').innerHTML = data.map(d => `
    <div class="kad" data-id="${d.id}">
      <div class="kad-info">
        <div class="kad-no">${escapeHtml(d.no || '-')}</div>
        <div class="kad-nama">${escapeHtml(d.pelanggan?.nama || '(Tiada nama)')}</div>
                <div class="kad-meta">
          <span>📅 ${formatTarikh(d.tarikh)}</span>
          ${d.jenis !== 'delivery'
            ? `<span>💰 RM ${formatRM(jumlahDokumen(d))}</span>`
            : `<span>📦 ${(d.items || []).length} item</span>`}
          <span class="badge-jenis ${d.jenis}">${labelJenis[d.jenis] || ''}</span>
          ${d.rujukQT ? `<span class="rujukan-badge">← ${escapeHtml(d.rujukQT)}</span>` : ''}
          ${d.rujukINV ? `<span class="rujukan-badge">← ${escapeHtml(d.rujukINV)}</span>` : ''}
          ${d.rujukINVDO ? `<span class="rujukan-badge">← ${escapeHtml(d.rujukINVDO)}</span>` : ''}
        </div>
      </div>
            <div class="kad-aksi">
        <button data-wa="${d.id}" title="WhatsApp">📱</button>
        <button data-edit="${d.id}" title="Edit">✏️</button>
        <button data-padam="${d.id}" title="Padam">🗑️</button>
      </div>
    </div>
  `).join('');

  // Nota bawah
  if (!adaCarian && !adaFilter && dokumen.length > 5) {
    $('#senarai').innerHTML += `
      <p style="text-align:center;font-size:.8rem;color:#94a3b8;padding:.8rem">
        Menunjukkan 5 terakhir · Taip untuk cari semua
      </p>`;
  }
}

/* =========================================================
   KIRA JUMLAH
   ========================================================= */
function jumlahDokumen(d) {
  if (!d.items || !d.items.length) return 0;
  return d.items.reduce((sum, it) => {
    const q = Number(it.kuantiti) || 0;
    const h = Number(it.harga) || 0;
    return sum + (q * h);
  }, 0);
}

/* =========================================================
   BUKA MODAL BORANG
   ========================================================= */
async function bukaModal(id = null, jenisPreset = null) {
  editId = id;
  const d = id ? dokumen.find(x => x.id === id) : null;
  
  // ⭐ Paksa jenisSemasa jadi string yang sah
  const jenisFinal = d ? d.jenis : (jenisPreset || 'invoice');
  jenisSemasa = ['invoice','quotation','receipt','delivery'].includes(jenisFinal)
    ? jenisFinal
    : 'invoice';
  console.log('bukaModal — jenis:', jenisSemasa);

  const modal = $('#modal');
  modal.classList.remove('hidden');
  modal.innerHTML = `
    <div class="modal-kandungan">
      <header class="modal-header">
        <h2>${id ? 'Edit ' + labelJenis(jenisSemasa) : 'Cipta ' + labelJenis(jenisSemasa)}</h2>
        <button id="tutupModal">✕</button>
      </header>
      <div class="borang" id="borangKandungan">
        ${id ? '' : renderPilihJenis()}
        <div id="borangFields"></div>
      </div>
    </div>`;

  $('#tutupModal').onclick = tutupModal;

  // Kalau baru & tiada ID → minta nombor dari server
  if (!id) {
    try {
      toast('Minta nombor...');
      const j = await apiGet('getNextNumber', { jenis: jenisSemasa });
      if (j.ok) {
        if (!d) window._noBaru = j.no;
        renderBorangFields(null, j.no);
      } else {
        toast('Gagal dapat nombor: ' + j.error);
        renderBorangFields(null, '');
      }
    } catch (e) {
      toast('Gagal: ' + e.message);
      renderBorangFields(null, '');
    }
  } else {
    renderBorangFields(d, d.no);
  }
}

function labelJenis(j) {
  return {
    invoice: 'Invois',
    quotation: 'Sebut Harga',
    receipt: 'Resit',
    delivery: 'Delivery Order'
  }[j] || j;
}

function renderPilihJenis() {
  return `
    <label>Jenis Dokumen
      <select id="pilihJenis">
        <option value="invoice"   ${jenisSemasa === 'invoice'   ? 'selected' : ''}>📄 Invois</option>
        <option value="quotation" ${jenisSemasa === 'quotation' ? 'selected' : ''}>📋 Sebut Harga</option>
        <option value="receipt"   ${jenisSemasa === 'receipt'   ? 'selected' : ''}>🧾 Resit</option>
        <option value="delivery"  ${jenisSemasa === 'delivery'  ? 'selected' : ''}>🚚 Delivery Order</option>
      </select>
      <span class="preview-hint">Tukar jenis akan minta nombor baru</span>
    </label>`;
}

/* ---------- RENDER BORANG IKUT JENIS ---------- */
function renderBorangFields(d, noAuto) {
  const jenis = d ? d.jenis : jenisSemasa;
  const data = d || {};
  const pel = data.pelanggan || {};
  const items = data.items || [{ bil: 1, butiran: '', kuantiti: 1, harga: 0 }];

  let fieldsHtml = '';

  if (jenis === 'invoice')    fieldsHtml = borangInvoice(data, pel, items, noAuto);
  if (jenis === 'quotation')  fieldsHtml = borangQuotation(data, pel, items, noAuto);
  if (jenis === 'receipt')    fieldsHtml = borangReceipt(data, pel, items, noAuto);
  if (jenis === 'delivery')   fieldsHtml = borangDelivery(data, pel, items, noAuto);

  $('#borangFields').innerHTML = fieldsHtml;
  pasangEventBorang(jenis);
  kemaskiniJumlah();
  pasangAutoFillPelanggan();
  pasangEventRujukan(jenis);      // ⬅️ TAMBAH INI
  if (!d) kosongkanNota();
  setTimeout(() => pasangAutoCheckRujukan(d), 100);
}

/* ---------- BORANG: INVOICE ---------- */
function borangInvoice(d, pel, items, noAuto) {
  return `
    <div class="baris-2">
      <label>No. Invois
        <input type="text" name="no" value="${escapeHtml(noAuto || d.no || '')}" readonly>
      </label>
      <label>Tarikh
        <input type="date" name="tarikh" value="${d.tarikh || tarikhHariIni()}">
      </label>
    </div>
	
	    ${htmlRujukan('invoice', d.rujukQT || '')}

    <label>Nama Pelanggan *
      <input type="text" name="pelNama" id="pelNama"
        value="${escapeHtml(pel.nama || '')}" autocomplete="off"
        list="senaraiPelanggan" placeholder="Taip atau pilih...">
      <datalist id="senaraiPelanggan">
        ${pelanggan.map(p => `<option value="${escapeHtml(p.nama)}">`).join('')}
      </datalist>
    </label>

    <label>Alamat Pelanggan
      <textarea name="pelAlamat" rows="2">${escapeHtml(pel.alamat || '')}</textarea>
    </label>

    <div class="baris-2">
      <label>Telefon
        <input type="text" name="pelTelefon" value="${escapeHtml(pel.telefon || '')}">
      </label>
      <label>Email
        <input type="email" name="pelEmail" value="${escapeHtml(pel.email || '')}">
      </label>
    </div>

    <label>Item</label>
    <table class="item-jadual" id="jadualItem">
      <thead>
        <tr>
          <th style="width:30px">#</th>
          <th>Butiran</th>
          <th style="width:60px">Qty</th>
          <th style="width:90px">Harga</th>
          <th style="width:90px" class="kanan">Jumlah</th>
          <th style="width:36px"></th>
        </tr>
      </thead>
      <tbody id="itemBody">
        ${items.map((it, i) => barisItem(it, i, false)).join('')}
      </tbody>
    </table>
    <button type="button" class="btn-tambah-item" id="btnTambahItem">+ Tambah Item</button>

    <div class="jumlah-kotak">
      <div class="jumlah-baris total">
        <span>JUMLAH KESELURUHAN</span>
        <span id="jumTotal">RM 0.00</span>
      </div>
    </div>

/* ---------- KEMASKINI JUMLAH ---------- */
function kemaskiniJumlah() {
  const rows = document.querySelectorAll('#itemBody tr');
  let total = 0;
  rows.forEach((tr, i) => {
    const q = Number(tr.querySelector('.inp-qty')?.value) || 0;
    const h = Number(tr.querySelector('.inp-harga')?.value) || 0;
    const jum = q * h;
    const sel = tr.querySelector('.jumlah-sel');
    if (sel) sel.textContent = formatRM(jum);
    total += jum;
  });
  const el = $('#jumTotal');
  if (el) el.textContent = 'RM ' + formatRM(total);
}

/* =========================================================
   SIMPAN DOKUMEN
   ========================================================= */
async function simpanDokumen(jenis, terusPrint = false) {
  // Ambil nilai dari borang
  const pelNama = document.querySelector('input[name="pelNama"]')?.value.trim();
  if (!pelNama) { toast('❌ Nama pelanggan wajib'); return; }

  const items = ambilItems();
  if (!items.length || !items.some(it => it.butiran)) {
    toast('❌ Isi sekurang-kurangnya 1 item');
    return;
  }

  // Simpan pelanggan ke senarai
  simpanPelangganKeSenarai({
    nama: pelNama,
    alamat: document.querySelector('textarea[name="pelAlamat"]')?.value || '',
    telefon: document.querySelector('input[name="pelTelefon"]')?.value || '',
    email: document.querySelector('input[name="pelEmail"]')?.value || ''
  });

  const data = {
    id: editId || uuid(),
    jenis: jenis,
    no: document.querySelector('input[name="no"]')?.value || '',
    tarikh: document.querySelector('input[name="tarikh"]')?.value || tarikhHariIni(),
    pelanggan: {
      nama: pelNama,
      alamat: document.querySelector('textarea[name="pelAlamat"]')?.value || '',
      telefon: document.querySelector('input[name="pelTelefon"]')?.value || '',
      email: document.querySelector('input[name="pelEmail"]')?.value || ''
    },
    items: items,
    nota: document.querySelector('textarea[name="nota"]')?.value || ''
  };

  // Tambah field khusus ikut jenis
  if (jenis === 'quotation') {
    data.sahHingga = document.querySelector('input[name="sahHingga"]')?.value || '';
  }
  if (jenis === 'receipt') {
    data.noInvoiceAsal = document.querySelector('input[name="noInvoiceAsal"]')?.value || '';
    data.kaedahBayaran = document.querySelector('select[name="kaedahBayaran"]')?.value || '';
    data.noRujukan = document.querySelector('input[name="noRujukan"]')?.value || '';
  }
  if (jenis === 'delivery') {
    data.noInvoiceRujukan = document.querySelector('input[name="noInvoiceRujukan"]')?.value || '';
  }

  // Simpan rujukan antara dokumen
  const fieldRujukan = namaFieldRujukan(jenis);
  if (fieldRujukan) {
    const nilaiRujukan = document.querySelector(`[name="${fieldRujukan}"]`)?.value.trim() || '';
    if (nilaiRujukan) data[fieldRujukan] = nilaiRujukan;
  }

  // Kalau baru, simpan dalam state lokal dahulu (untuk print)
  if (editId) {
    const i = dokumen.findIndex(x => x.id === editId);
    if (i >= 0) dokumen[i] = { ...dokumen[i], ...data };
  } else {
    dokumen.push(data);
    editId = data.id;
  }

  // Hantar ke server
    // Auto-save customer ke Google Sheet (senyap, tak block)
  autoSaveCustomer();

  // Hantar ke server
  toast('Menyimpan...');
  try {
    const j = await apiPost({ action: 'saveDokumen', dokumen: data });
    if (!j.ok) throw new Error(j.error || 'Gagal');
    toast('✅ Disimpan');
    renderSenarai();

    if (terusPrint) {
      setTimeout(() => cetakDokumen(data), 300);
    } else {
      tutupModal();
    }
  } catch (e) {
    console.warn(e);
    toast('❌ Gagal simpan: ' + e.message);
  }
}

function ambilItems() {
  const rows = document.querySelectorAll('#itemBody tr');
  const arr = [];
  rows.forEach((tr, i) => {
    const butiran = tr.querySelector('.inp-butiran')?.value.trim() || '';
    const kuantiti = Number(tr.querySelector('.inp-qty')?.value) || 0;
    const harga = Number(tr.querySelector('.inp-harga')?.value) || 0;
    arr.push({
      bil: i + 1,
      butiran,
      kuantiti,
      harga
    });
  });
  return arr;
}

async function simpanPelangganKeSenarai(p) {
  if (!p.nama) return;
  // Cari dalam senarai
  const idx = pelanggan.findIndex(x => x.nama.toLowerCase() === p.nama.toLowerCase());
  if (idx >= 0) {
    pelanggan[idx] = { ...pelanggan[idx], ...p };
  } else {
    pelanggan.push(p);
  }
  // Simpan ke server (senyap, tak tunggu)
  try { await apiPost({ action: 'savePelanggan', pelanggan: p }); }
  catch (e) { console.warn('Gagal simpan pelanggan:', e); }
}

async function padamDokumen(id) {
  if (!confirm('Padam dokumen ini? Tindakan ini tidak boleh diundur.')) return;
  try {
    toast('Memadam...');
    const j = await apiPost({ action: 'padamDokumen', id });
    if (!j.ok) throw new Error(j.error || 'Gagal');
    dokumen = dokumen.filter(d => d.id !== id);
    renderSenarai();
    tutupModal();
    toast('✅ Dipadam');

    toast('❌ Gagal: ' + e.message);
  }
}

/* =========================================================

function cetakDokumen(d) {
  const html = binaHtmlCetak(d);
  $('#printArea').innerHTML = html;

  // Set saiz A5 untuk receipt
  document.body.classList.remove('print-a5');
  if (d.jenis === 'receipt') {
    document.body.classList.add('print-a5');
    // Sisip style @page A5
    let st = document.getElementById('printA5Style');
    if (!st) {
      st = document.createElement('style');
      st.id = 'printA5Style';
      st.textContent = '@media print { @page { size: A5; margin: 8mm; } }';
      document.head.appendChild(st);
    }
  } else {
    const st = document.getElementById('printA5Style');
    if (st) st.remove();
  }

  setTimeout(() => window.print(), 100);
}

function pasangEvent() {
  if (window._eventDahPasang) return;
  window._eventDahPasang = true;

  // Butang utama
  $('#btnTambah').onclick = () => bukaModal();
  $('#btnSync').onclick = () => muatSemua(false);
  $('#btnTetapan').onclick = bukaTetapan;

  // Carian
  $('#carian').oninput = e => {
    kataCarian = e.target.value;
    renderSenarai();
  };

  // Filter jenis
  $$('.filter button').forEach(b => {
    b.onclick = () => {
      $$('.filter button').forEach(x => x.classList.remove('aktif'));
      b.classList.add('aktif');
      filterJenis = b.dataset.filter;
      renderSenarai();
    };
  });

  // Klik kad
   
  $('#senarai').addEventListener('click', (e) => {
    const btnWa = e.target.closest('[data-wa]');         
    if (btnWa) {                                          
      e.stopPropagation();                                
      const doc = dokumen.find(x => x.id === btnWa.dataset.wa);
      if (doc) shareWhatsApp(doc);
      return;                                             
    }                                                     
  
    const btnPadam = e.target.closest('[data-padam]');
    if (btnPadam) {
      e.stopPropagation();
      padamDokumen(btnPadam.dataset.padam);
      return;
    }
    const btnEdit = e.target.closest('[data-edit]');
    if (btnEdit) {
      e.stopPropagation();
      bukaModal(btnEdit.dataset.edit);
      return;
    }
    const kad = e.target.closest('.kad');
    if (kad) bukaModal(kad.dataset.id);
  });
}

async function autoSaveCustomer() {
  const nama    = (document.querySelector('[name="pelNama"]')?.value || '').trim();
  const alamat  = (document.querySelector('[name="pelAlamat"]')?.value || '').trim();
  const telefon = (document.querySelector('[name="pelTelefon"]')?.value || '').trim();
  const email   = (document.querySelector('[name="pelEmail"]')?.value || '').trim();
  if (!nama) return;

  // Update cache lokal
  const idx = pelanggan.findIndex(p => (p.nama||'').toLowerCase() === nama.toLowerCase());
  const rec = { nama, alamat, telefon, email };
  if (idx >= 0) pelanggan[idx] = { ...pelanggan[idx], ...rec };
  else pelanggan.push(rec);
  renderDatalistPelanggan();

  // Hantar ke server (senyap)
  try {
    await apiPost({ action: 'saveCustomer', customer: rec });
  } catch (e) {
    console.warn('Gagal save customer:', e);
  }
}

/* =========================================================
   RUJUKAN ANTARA DOKUMEN
   (QT → INV → DO → RCT)
   ========================================================= */

// Senarai dokumen yang boleh dirujuk oleh jenis semasa
function dokumenBolehRujuk(jenisSemasa) {
  const map = {
    invoice:   ['quotation'],
    quotation: [],              // sebut harga tak rujuk mana-mana
    receipt:   ['invoice'],
    delivery:  ['invoice', 'quotation']
  };
  return map[jenisSemasa] || [];
}

// Label field rujukan ikut jenis
function labelRujukan(jenis) {
  return {
    invoice:  'Rujukan Sebut Harga',
    receipt:  'Rujukan Invois',
    delivery: 'Rujukan Invois / Sebut Harga'
  }[jenis] || '';
}

// Nama field dalam data
function namaFieldRujukan(jenis) {
  return {
    invoice:  'rujukQT',
    receipt:  'rujukINV',
    delivery: 'rujukINVDO'
  }[jenis];
}

// Bina HTML field rujukan
function htmlRujukan(jenis, nilaiSemasa) {
  const bolehRujuk = dokumenBolehRujuk(jenis);
  if (!bolehRujuk.length) return '';

  // Ambil dokumen yang boleh dirujuk, susun terbaru dulu
  const list = dokumen
    .filter(d => bolehRujuk.includes(d.jenis))
    .sort((a, b) => new Date(b.dicipta || 0) - new Date(a.dicipta || 0));

  const label = labelRujukan(jenis);
  const namaField = namaFieldRujukan(jenis);

  return `
    <label>${label} <span class="preview-hint">(optional)</span>
      <input type="text" name="${namaField}" id="inputRujukan"
        value="${escapeHtml(nilaiSemasa || '')}"
        list="senaraiRujukan"
        placeholder="Taip atau pilih no dokumen..."
        autocomplete="off">
      <datalist id="senaraiRujukan">
        ${list.map(d => `<option value="${escapeHtml(d.no)}">${escapeHtml(d.pelanggan?.nama || '')}</option>`).join('')}
      </datalist>
            <span class="preview-hint">
        ${jenis === 'invoice' ? 'Pilih sebut harga → auto-isi items + pelanggan' : ''}
        ${jenis === 'receipt' ? 'Pilih invois → auto-isi items + pelanggan' : ''}
        ${jenis === 'delivery' ? 'Pilih invois/sebut harga → auto-isi items + pelanggan' : ''}
      </span>
      ${nilaiSemasa ? `<button type="button" class="btn-refresh-rujukan" id="btnRefreshRujukan">🔄 Refresh dari ${escapeHtml(nilaiSemasa)}</button>` : ''}
    </label>`;
}

// Import data dari dokumen rujukan
function ambilDariRujukan(noRujukan) {
  if (!noRujukan) return null;
  const doc = dokumen.find(d => d.no === noRujukan);
  return doc || null;
}

// Pasang event auto-import bila user taip/pilih rujukan
function pasangEventRujukan(jenis) {
  const input = $('#inputRujukan');
  if (!input || input._rujukanPasang) return;
  input._rujukanPasang = true;

  input.addEventListener('change', async () => {
    const no = input.value.trim();
    if (!no) return;

    const doc = ambilDariRujukan(no);
    if (!doc) {
      toast('⚠️ Dokumen ' + no + ' tak dijumpai');
      return;
    }

    // Tanya dulu kalau ada data sedia ada
    const adaData = document.querySelector('[name="pelNama"]')?.value.trim()
                 || document.querySelector('.inp-butiran')?.value.trim();
    if (adaData) {
      if (!confirm('Ganti data sedia ada dengan data dari ' + no + '?')) {
        input.value = '';
        return;
      }
    }

    // Auto-isi pelanggan
    if (doc.pelanggan) {
      const nama = document.querySelector('[name="pelNama"]');
      const alamat = document.querySelector('[name="pelAlamat"]');
      const telefon = document.querySelector('[name="pelTelefon"]');
      const email = document.querySelector('[name="pelEmail"]');
      if (nama) nama.value = doc.pelanggan.nama || '';
      if (alamat) alamat.value = doc.pelanggan.alamat || '';
      if (telefon) telefon.value = doc.pelanggan.telefon || '';
      if (email) email.value = doc.pelanggan.email || '';
    }

    // Auto-isi items
    if (doc.items && doc.items.length) {
      const tbody = $('#itemBody');
      if (tbody) {
        tbody.innerHTML = '';
        const isDO = jenis === 'delivery';
        doc.items.forEach((it, i) => {
          const tr = document.createElement('tr');
          tr.dataset.idx = i;
          if (isDO) {
            tr.innerHTML = barisItemDOSel({
              bil: i + 1,
              butiran: it.butiran || '',
              kuantiti: it.kuantiti || 1
            }, i);
          } else {
            tr.innerHTML = barisItemSel({
              bil: i + 1,
              butiran: it.butiran || '',
              kuantiti: it.kuantiti || 1,
              harga: it.harga || 0
            }, i);
          }
          tbody.appendChild(tr);
        });
        kemaskiniJumlah();
      }
    }

    // Auto-isi nota
    const notaField = document.querySelector('textarea[name="nota"]');
    if (notaField && doc.nota) {
      notaField.value = doc.nota;
    }

    // Auto-isi field khusus
    if (jenis === 'receipt' && doc.kaedahBayaran) {
      const kb = document.querySelector('select[name="kaedahBayaran"]');
      if (kb && !kb.value) kb.value = doc.kaedahBayaran;
    }
    if (jenis === 'receipt' && doc.no) {
      const nia = document.querySelector('input[name="noInvoiceAsal"]');
      if (nia && !nia.value) nia.value = doc.no;
    }
    if (jenis === 'delivery' && doc.no) {
      const nir = document.querySelector('input[name="noInvoiceRujukan"]');
      if (nir && !nir.value) nir.value = doc.no;
    }

    toast('✅ Data dari ' + no + ' dimuat');
  });
  
  // Butang Refresh dari Rujukan (kalau ada)
  const btnRefresh = $('#btnRefreshRujukan');
  if (btnRefresh) {
    btnRefresh.onclick = () => {
      const no = $('#inputRujukan')?.value.trim();
      if (!no) { toast('⚠️ Tiada rujukan'); return; }
      const doc = ambilDariRujukan(no);
      if (!doc) { toast('⚠️ Dokumen ' + no + ' tak dijumpai'); return; }

      // Dapatkan data dokumen semasa (dari editId)
      const dataSemasa = editId ? dokumen.find(x => x.id === editId) : null;
      if (!dataSemasa) {
        toast('⚠️ Simpan dokumen dulu');
        return;
      }

      if (!confirm('Replace data semasa dengan data terkini dari ' + no + '?')) return;

      updateDariRujukan(dataSemasa, doc);
      toast('✅ Data dikemaskini dari ' + no);
    };
  }

  
  
}

/* =========================================================
   AUTO-CHECK RUJUKAN — deteksi perubahan
   ========================================================= */

// Bandingkan dokumen semasa dengan rujukan → senarai perbezaan
function checkRujukanBeza(d) {
  const fieldRujukan = namaFieldRujukan(d.jenis);
  if (!fieldRujukan) return null;

  const noRujukan = d[fieldRujukan];
  if (!noRujukan) return null;

  const doc = dokumen.find(x => x.no === noRujukan);
  if (!doc) return { error: 'Dokumen rujukan tak dijumpai' };

  const beza = [];

  // Bandingkan nama pelanggan
  const namaSemasa = (d.pelanggan?.nama || '').trim();
  const namaRujukan = (doc.pelanggan?.nama || '').trim();
  if (namaSemasa !== namaRujukan) {
    beza.push({
      field: 'Pelanggan',
      lama: namaSemasa || '(kosong)',
      baru: namaRujukan || '(kosong)'
    });
  }

  // Bandingkan alamat
  const alamatSemasa = (d.pelanggan?.alamat || '').trim();
  const alamatRujukan = (doc.pelanggan?.alamat || '').trim();
  if (alamatSemasa !== alamatRujukan) {
    beza.push({
      field: 'Alamat',
      lama: alamatSemasa ? '(ada)' : '(kosong)',
      baru: alamatRujukan ? '(ada)' : '(kosong)'
    });
  }

  // Bandingkan bilangan items
  const itemsSemasa = d.items || [];
  const itemsRujukan = doc.items || [];
  if (itemsSemasa.length !== itemsRujukan.length) {
    beza.push({
      field: 'Bilangan item',
      lama: String(itemsSemasa.length),
      baru: String(itemsRujukan.length)
    });
  } else {
    // Bandingkan item satu-satu
    itemsRujukan.forEach((itRuj, i) => {
      const itSem = itemsSemasa[i] || {};
      const butiranRuj = (itRuj.butiran || '').trim();
      const butiranSem = (itSem.butiran || '').trim();
      const qtyRuj = Number(itRuj.kuantiti) || 0;
      const qtySem = Number(itSem.kuantiti) || 0;
      const hargaRuj = Number(itRuj.harga) || 0;
      const hargaSem = Number(itSem.harga) || 0;

      if (butiranRuj !== butiranSem) {
        beza.push({
          field: `Item #${i + 1} butiran`,
          lama: butiranSem || '(kosong)',
          baru: butiranRuj || '(kosong)'
        });
      }
      if (qtyRuj !== qtySem) {
        beza.push({
          field: `Item #${i + 1} qty`,
          lama: String(qtySem),
          baru: String(qtyRuj)
        });
      }
      if (hargaRuj !== hargaSem) {
        beza.push({
          field: `Item #${i + 1} harga`,
          lama: 'RM ' + formatRM(hargaSem),
          baru: 'RM ' + formatRM(hargaRuj)
        });
      }
    });
  }

  // Bandingkan jumlah keseluruhan
  const jumlahSemasa = jumlahDokumen(d);
  const jumlahRujukan = jumlahDokumen(doc);
  if (Math.abs(jumlahSemasa - jumlahRujukan) > 0.01) {
    beza.push({
      field: 'JUMLAH',
      lama: 'RM ' + formatRM(jumlahSemasa),
      baru: 'RM ' + formatRM(jumlahRujukan)
    });
  }

  // Bandingkan nota
  const notaSemasa = (d.nota || '').trim();
  const notaRujukan = (doc.nota || '').trim();
  if (notaSemasa !== notaRujukan) {
    beza.push({
      field: 'Nota',
      lama: notaSemasa ? '(ada)' : '(kosong)',
      baru: notaRujukan ? '(ada)' : '(kosong)'
    });
  }

  if (!beza.length) return null; // Tiada beza

  return {
    noRujukan: noRujukan,
    doc: doc,
    beza: beza
  };
}

// Bina HTML badge amaran

      </div>
    </div>`;

// Update dokumen semasa dengan data dari rujukan
function updateDariRujukan(d, doc) {
  // Pelanggan
  const nama = document.querySelector('[name="pelNama"]');
  const alamat = document.querySelector('[name="pelAlamat"]');
  const telefon = document.querySelector('[name="pelTelefon"]');
  const email = document.querySelector('[name="pelEmail"]');
  if (nama) nama.value = doc.pelanggan?.nama || '';
  if (alamat) alamat.value = doc.pelanggan?.alamat || '';
  if (telefon) telefon.value = doc.pelanggan?.telefon || '';
  if (email) email.value = doc.pelanggan?.email || '';

  // Items
  if (doc.items && doc.items.length) {
    const tbody = $('#itemBody');
    if (tbody) {
      tbody.innerHTML = '';
      const isDO = d.jenis === 'delivery';
      doc.items.forEach((it, i) => {
        const tr = document.createElement('tr');
        tr.dataset.idx = i;
        if (isDO) {
          tr.innerHTML = barisItemDOSel({
            bil: i + 1,
            butiran: it.butiran || '',
            kuantiti: it.kuantiti || 1
          }, i);
        } else {
          tr.innerHTML = barisItemSel({
            bil: i + 1,
            butiran: it.butiran || '',
            kuantiti: it.kuantiti || 1,
            harga: it.harga || 0
          }, i);
        }
        tbody.appendChild(tr);
      });
      kemaskiniJumlah();
    }
  }

  // Nota
  const nota = document.querySelector('textarea[name="nota"]');
  if (nota && doc.nota) nota.value = doc.nota;

  // Field khusus receipt
  if (d.jenis === 'receipt') {
    if (doc.kaedahBayaran) {
      const kb = document.querySelector('select[name="kaedahBayaran"]');
      if (kb && !kb.value) kb.value = doc.kaedahBayaran;
    }
    if (doc.no) {
      const nia = document.querySelector('input[name="noInvoiceAsal"]');
      if (nia) nia.value = doc.no;
    }
  }
  // Field khusus DO
  if (d.jenis === 'delivery' && doc.no) {
    const nir = document.querySelector('input[name="noInvoiceRujukan"]');
    if (nir) nir.value = doc.no;
  }
}

// Auto-check masa borang dibuka + pasang butang update
function pasangAutoCheckRujukan(d) {
  if (!d || !d.id) return;                 // hanya untuk dokumen sedia ada
  const hasil = checkRujukanBeza(d);
  if (!hasil) return;                      // tiada beza, tak payah buat apa

  // Sisip badge di atas borang
  const fields = $('#borangFields');
  if (!fields) return;

  const badge = document.createElement('div');
  badge.innerHTML = htmlAmaranRujukan(hasil);
  const badgeEl = badge.firstElementChild;
  fields.insertBefore(badgeEl, fields.firstChild);

  // Butang abaikan
  const btnAbaikan = $('#btnAbaikanAmaran');
  if (btnAbaikan) {
    btnAbaikan.onclick = () => {
      badgeEl.remove();
      toast('Amaran diabaikan — data kekal');
    };
  }

  // Butang update
  const btnUpdate = $('#btnUpdateRujukan');
  if (btnUpdate) {
    btnUpdate.onclick = () => {
      updateDariRujukan(d, hasil.doc);
      badgeEl.remove();
      toast('✅ Data dikemaskini dari ' + hasil.noRujukan);
    };
  }
}

/* =========================================================
   WHATSAPP SHARE
   ========================================================= */

// Bersihkan no telefon ke format 60xxxxxxxxx (Malaysia)
function formatNoWa(no) {
  if (!no) return '';
  let n = String(no).replace(/\D/g, '');
  if (!n) return '';
  // Tukar 0xxxxxxxxx → 60xxxxxxxxx
  if (n.startsWith('0')) n = '60' + n.slice(1);
  // Kalau dah 60 atau 6, kekalkan
  if (!n.startsWith('60') && !n.startsWith('6')) n = '60' + n;
  return n;
}

// Bina mesej WhatsApp ikut jenis dokumen
function binaMesejWa(d) {
  const s = syarikat;
  const namaSyarikat = s.nama || 'Salcripta Marketing';
  const namaPelanggan = d.pelanggan?.nama || 'Pelanggan';
  const jumlah = formatRM(jumlahDokumen(d));

  let mesej = '';

  if (d.jenis === 'invoice') {
    mesej = `Salam ${namaPelanggan},

Invois *${d.no}* untuk jumlah *RM ${jumlah}* telah disediakan.
Tarikh: ${formatTarikh(d.tarikh)}
${d.rujukQT ? `Rujukan: ${d.rujukQT}\n` : ''}
Maklumat pembayaran:
Bank: ${s.bank?.nama || '-'}
No. Akaun: ${s.bank?.noAkaun || '-'}
Nama: ${s.bank?.pemilik || '-'}

Terima kasih.
- ${namaSyarikat}`;
  }

  else if (d.jenis === 'quotation') {
    mesej = `Salam ${namaPelanggan},

Sebut harga *${d.no}* untuk jumlah *RM ${jumlah}*.
Tarikh: ${formatTarikh(d.tarikh)}
Sah hingga: ${formatTarikh(d.sahHingga)}

Terima kasih.
- ${namaSyarikat}`;
  }

  else if (d.jenis === 'receipt') {
    mesej = `Salam ${namaPelanggan},

Terima kasih atas pembayaran *RM ${jumlah}*.
Resit *${d.no}* telah dikeluarkan.
Tarikh: ${formatTarikh(d.tarikh)}
${d.noInvoiceAsal ? `Rujukan Invois: ${d.noInvoiceAsal}\n` : ''}${d.kaedahBayaran ? `Kaedah: ${d.kaedahBayaran}\n` : ''}
- ${namaSyarikat}`;
  }

  else if (d.jenis === 'delivery') {
    mesej = `Salam ${namaPelanggan},

Pesanan untuk *${d.no}* telah dihantar.
Tarikh: ${formatTarikh(d.tarikh)}
${d.noInvoiceRujukan ? `Rujukan Invois: ${d.noInvoiceRujukan}\n` : ''}${d.rujukINVDO ? `Rujukan: ${d.rujukINVDO}\n` : ''}
Sila semak barang semasa penerimaan.

- ${namaSyarikat}`;
  }

  return mesej;
}

// Buka modal preview WhatsApp
function shareWhatsApp(d) {
  const mesejDefault = binaMesejWa(d);
  const noDefault = formatNoWa(d.pelanggan?.telefon || '');

  $('#modal').classList.remove('hidden');
  $('#modal').innerHTML = `
    <div class="modal-kandungan">
      <header class="modal-header">
        <h2>📱 WhatsApp — ${escapeHtml(d.no || '')}</h2>
        <button id="tutupModal">✕</button>
      </header>
      <div class="borang">
        <label>No. Telefon (WhatsApp)
          <input type="tel" id="waNo" value="${escapeHtml(noDefault)}"
                 placeholder="cth: 0123456789" inputmode="tel">
          <span class="preview-hint">Auto dari pelanggan, boleh edit</span>
        </label>

        <label>Mesej
          <textarea id="waMesej" rows="10" style="font-family:inherit">${escapeHtml(mesejDefault)}</textarea>
        </label>

        <div class="wa-aksi">
          <button id="waBatal" class="batal">Batal</button>
          <button id="waHantar">📱 Buka WhatsApp</button>
        </div>
      </div>
    </div>`;

  $('#tutupModal').onclick = tutupModal;
  $('#waBatal').onclick = tutupModal;

  $('#waHantar').onclick = () => {
    const no = formatNoWa($('#waNo').value.trim());
    const mesej = $('#waMesej').value.trim();
    if (!no) { toast('❌ No. telefon diperlukan'); return; }
    if (!mesej) { toast('❌ Mesej kosong'); return; }

    const url = `https://wa.me/${no}?text=${encodeURIComponent(mesej)}`;
    window.open(url, '_blank');
    tutupModal();
    toast('📱 WhatsApp dibuka');
  };
}

/* =========================================================
   PASANG EVENT BORANG — v5 (final)
   ========================================================= */
function pasangEventBorang(jenis) {
  console.log('📋 pasangEventBorang — jenis:', jenis);

  // ⭐ Delegation GLOBAL untuk dropdown jenis
  if (!window._delegasiJenisDipasang) {
    window._delegasiJenisDipasang = true;
    console.log('📋 Delegation dropdown DIPASANG');

    document.addEventListener('change', async (e) => {
      const target = e.target;
      if (!target || target.tagName !== 'SELECT') return;

      const jenisSah = ['invoice', 'quotation', 'receipt', 'delivery'];
      if (!jenisSah.includes(target.value)) return;

      // Pastikan dalam borang modal
      const dalamBorang = target.closest('#borangKandungan') || target.closest('#borangFields');
      if (!dalamBorang) return;

      console.log('📋 Dropdown TUKAR ke:', target.value);
      jenisSemasa = target.value;

      // Buka semula modal dengan jenis baru
      await bukaModal(null, target.value);
    });
  }

  // Auto-kira sah hingga (quotation)
  const tarikh = document.querySelector('input[name="tarikh"]');
  const sahHingga = document.querySelector('input[name="sahHingga"]');
  if (tarikh && sahHingga && jenis === 'quotation') {
    tarikh.onchange = () => {
      if (!sahHingga.value || sahHingga.dataset.auto === '1') {
        sahHingga.value = tambahHari(tarikh.value, 30);
      }
    };
  }

  // Tambah item
  const btnTambah = $('#btnTambahItem');
  if (btnTambah) {
    btnTambah.onclick = () => {
      const tbody = $('#itemBody');
      if (!tbody) return;
      const i = tbody.children.length;
      const tr = document.createElement('tr');
      tr.dataset.idx = i;
      if (jenis === 'delivery') {
        tr.innerHTML = barisItemDOSel({ bil: i + 1, butiran: '', kuantiti: 1 }, i);
      } else {
        tr.innerHTML = barisItemSel({ bil: i + 1, butiran: '', kuantiti: 1, harga: 0 }, i);
      }
      tbody.appendChild(tr);
      kemaskiniJumlah();
    };
  }

  // Auto-kira jumlah
  const itemBody = $('#itemBody');
  if (itemBody && !itemBody._listenerAutoKira) {
    itemBody._listenerAutoKira = true;
    itemBody.addEventListener('input', (e) => {
      if (e.target.matches('.inp-qty, .inp-harga')) kemaskiniJumlah();
    });
  }

  // Padam item
  if (itemBody && !itemBody._listenerPadamItem) {
    itemBody._listenerPadamItem = true;
    itemBody.addEventListener('click', (e) => {
      const btn = e.target.closest('.btn-padam-item');
      if (!btn) return;
      const tr = btn.closest('tr');
      const tbody = tr.parentNode;
      if (tbody.children.length <= 1) { toast('Mesti ada 1 item'); return; }
      tr.remove();
      [...tbody.children].forEach((r, i) => {
        const td = r.querySelector('td');
        if (td) td.textContent = i + 1;
      });
      kemaskiniJumlah();
    });
  }

  // Butang aksi
  const btnSimpan = $('#btnSimpan');
  if (btnSimpan) btnSimpan.onclick = () => simpanDokumen(jenis);

  const btnPadamDok = $('#btnPadamDok');
  if (btnPadamDok) btnPadamDok.onclick = () => padamDokumen(editId);

  const btnPrint = $('#btnPrint');
  if (btnPrint) {
    btnPrint.onclick = () => {
      toast('Simpan dulu...');
      setTimeout(() => simpanDokumen(jenis, true), 100);
    };
  }
  
    // Butang WhatsApp
  const btnWA = $('#btnWA');
  if (btnWA) {
    btnWA.onclick = () => {
      const dataDok = editId ? dokumen.find(x => x.id === editId) : null;
      if (dataDok) {
        shareWhatsApp(dataDok);
      } else {
        if (confirm('Simpan dokumen dulu sebelum share ke WhatsApp?')) {
          simpanDokumen(jenis);
          setTimeout(() => {
            const baru = dokumen.find(x => x.id === editId);
            if (baru) shareWhatsApp(baru);
          }, 800);
        }
      }
    };
  }
}
</script>
